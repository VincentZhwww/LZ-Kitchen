<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>留子厨房 LZ Kitchen</title>
<script src="https://fastly.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#ffffff;--ink:#1f2622;--ink-2:#6b726c;--ink-3:#9aa19b;--line:#eceeed;
    --green:#2d4a3e;--green-soft:#eef3ef;--green-mid:#8fb39e;--price:#c2452d;--radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#f4f5f3;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
    display:flex;justify-content:center;
  }
  .phone{
    width:100%;max-width:420px;background:var(--bg);height:100dvh;
    position:relative;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.06);
  }
  .view{display:none;flex-direction:column;flex:1;min-height:0;animation:fade .3s ease both;}
  .view.active{display:flex;}
  .view-scroll{flex:1;min-height:0;overflow-y:auto;}
  @keyframes fade{from{opacity:0;transform:translateX(10px);}to{opacity:1;transform:translateX(0);}}

  .nav{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;flex-shrink:0;}
  .nav .back{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);background:#f6f7f6;cursor:pointer;transition:all .25s ease;}
  .nav .back:active{transform:scale(.92);background:#eef0ee;}
  .nav .title{font-size:16px;font-weight:600;letter-spacing:.02em;}
  .nav .placeholder{width:36px;}
  .cart-entry{position:relative;width:38px;height:38px;border-radius:50%;background:#f6f7f6;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s ease;}
  .cart-entry:active{transform:scale(.92);background:#eef0ee;}
  .cart-entry svg{width:25px;height:25px;}
  .cart-entry .badge{position:absolute;top:-3px;right:-5px;background:var(--price);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600;}

  .shop-head{padding:6px 20px 16px;}
  .shop-head .name{font-size:24px;font-weight:700;letter-spacing:.01em;}
  .shop-head .name span{font-size:14px;font-weight:500;color:var(--ink-3);margin-left:6px;letter-spacing:.04em;}
  .group-label{padding:14px 20px 10px;font-size:12.5px;color:var(--ink-3);letter-spacing:.05em;}

  .menu-list{padding:0 16px;display:flex;flex-direction:column;gap:14px;}
  .menu-card{display:flex;gap:14px;border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;background:var(--bg);transition:all .25s ease;animation:rise .5s ease both;}
  .menu-card:active{transform:scale(.98);background:#fafbfa;}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .menu-thumb{width:96px;height:96px;border-radius:14px;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,#f3f0e9,#e9efe9);display:flex;align-items:center;justify-content:center;}
  .menu-thumb img{width:100%;height:100%;object-fit:cover;}
  .menu-info{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0;}
  .menu-info .n{font-size:16px;font-weight:600;}
  .menu-info .d{font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .menu-info .p{font-size:14.5px;font-weight:700;color:var(--price);margin-top:6px;}

  .dish-img{margin:0 16px;width:calc(100% - 32px);aspect-ratio:16/10;border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,#f3f0e9,#e9efe9);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dish-img img{width:100%;height:100%;object-fit:cover;}
  .dish-body{padding:18px 20px 0;}
  .dish-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .dish-name{font-size:19px;font-weight:600;}
  .dish-desc{margin-top:8px;font-size:13px;line-height:1.7;color:var(--ink-2);}
  .dish-price{font-size:16px;font-weight:700;color:var(--price);white-space:nowrap;padding-top:2px;}

  .section{padding:20px 20px 0;}
  .section-label{font-size:13px;color:var(--ink-3);margin-bottom:12px;letter-spacing:.03em;}
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{padding:9px 15px;border-radius:22px;font-size:13.5px;border:1px solid var(--line);background:#fafbfa;color:var(--ink-2);cursor:pointer;user-select:none;transition:all .25s ease;}
  .chip:active{transform:scale(.96);}
  .chip.on{background:var(--green-soft);border-color:var(--green-mid);color:var(--green);font-weight:500;}

  .qty-row{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 0;}
  .qty-row .lab{font-size:15px;font-weight:500;}
  .stepper{display:flex;align-items:center;gap:16px;}
  .stepper button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fafbfa;color:var(--ink);font-size:17px;line-height:1;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;justify-content:center;}
  .stepper button:active{transform:scale(.9);}
  .stepper button:disabled{opacity:.35;cursor:not-allowed;}
  .stepper .num{font-size:16px;font-weight:600;min-width:20px;text-align:center;}

  .footer{flex-shrink:0;padding:14px 20px calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--bg);border-top:1px solid var(--line);}
  .total{display:flex;flex-direction:column;}
  .total .t-label{font-size:11.5px;color:var(--ink-3);}
  .total .t-price{font-size:19px;font-weight:700;color:var(--price);}
  .btn{border:none;cursor:pointer;font-family:inherit;background:var(--green);color:#fff;font-size:15px;font-weight:600;padding:15px 34px;border-radius:26px;letter-spacing:.02em;transition:all .25s ease;}
  .btn:active{transform:scale(.96);opacity:.92;}
  .btn.ghost{background:#f1f3f1;color:var(--green);}
  .btn:disabled{opacity:.55;cursor:not-allowed;}

  .cart-list{padding:16px 20px 0;display:flex;flex-direction:column;gap:16px;}
  .cart-item{border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .cart-item .ci-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .ci-name{font-size:15.5px;font-weight:600;}
  .ci-price{font-size:14.5px;font-weight:700;color:var(--price);white-space:nowrap;}
  .ci-opts{margin-top:8px;font-size:12.5px;color:var(--ink-2);line-height:1.6;}
  .ci-opts .tag{display:inline-block;background:#f4f6f4;border-radius:10px;padding:2px 8px;margin:2px 6px 2px 0;}
  .ci-qty{margin-top:8px;font-size:12.5px;color:var(--ink-3);}

  .field{padding:20px 20px 0;}
  .field-label{font-size:13px;color:var(--ink-3);margin-bottom:12px;letter-spacing:.03em;}
  .field input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;font-family:inherit;color:var(--ink);background:#fafbfa;outline:none;transition:border-color .25s ease,background .25s ease;}
  .field input:focus{border-color:var(--green-mid);background:#fff;}
  .field input::placeholder{color:var(--ink-3);}
  .note{padding:20px 20px 0;}
  .note textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;font-family:inherit;color:var(--ink);background:#fafbfa;resize:none;outline:none;transition:border-color .25s ease,background .25s ease;}
  .note textarea:focus{border-color:var(--green-mid);background:#fff;}
  .note textarea::placeholder{color:var(--ink-3);}

  .empty{padding:60px 20px;text-align:center;color:var(--ink-3);font-size:14px;}

  .receipt-wrap{padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .receipt-tip{font-size:13.5px;color:var(--ink-2);text-align:center;line-height:1.6;}
  .receipt-img{width:100%;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);}
  .receipt-panel{width:100%;background:#fff;border:1px dashed var(--line);border-radius:16px;padding:22px 20px;}
  .rp-head{text-align:center;border-bottom:1px dashed var(--line);padding-bottom:14px;margin-bottom:14px;}
  .rp-head .rp-title{font-size:18px;font-weight:700;color:var(--green);}
  .rp-head .rp-sub{font-size:12px;color:var(--ink-3);margin-top:4px;}
  .rp-meta{font-size:13px;color:var(--ink-2);line-height:1.9;}
  .rp-items{margin:14px 0;display:flex;flex-direction:column;gap:12px;}
  .rp-item .ri-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;}
  .rp-item .ri-opts{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.6;}
  .rp-note{font-size:13px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:12px;margin-top:12px;line-height:1.6;}
  .rp-total{display:flex;justify-content:space-between;font-size:15px;font-weight:700;border-top:1px dashed var(--line);padding-top:12px;margin-top:12px;color:var(--price);}
  .receipt-actions{display:flex;flex-direction:column;gap:10px;width:100%;}

  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);background:rgba(31,38,34,.92);color:#fff;font-size:13.5px;padding:11px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:all .3s ease;z-index:50;white-space:nowrap;max-width:88%;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="phone">

  <div class="view active" id="view-home">
    <div class="nav">
      <div class="placeholder"></div>
      <div class="title">菜单</div>
      <div class="cart-entry" onclick="go('confirm')">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1f2622" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.6"/><circle cx="20" cy="21" r="1.6"/><path d="M1 1h4l2.6 12.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <div class="badge" id="cart-badge" style="display:none">0</div>
      </div>
    </div>
    <div class="view-scroll" id="menu-scroll"></div>
  </div>

  <div class="view" id="view-detail">
    <div class="nav">
      <div class="back" onclick="go('home')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="title">菜品详情</div>
      <div class="placeholder"></div>
    </div>
    <div class="view-scroll">
      <div class="dish-img"><img id="d-img" alt="" onerror="this.style.display='none'"></div>
      <div class="dish-body">
        <div class="dish-top">
          <div>
            <div class="dish-name" id="d-name"></div>
            <div class="dish-desc" id="d-desc"></div>
          </div>
          <div class="dish-price" id="d-price"></div>
        </div>
      </div>
      <div class="section" id="sec-avoid" style="display:none">
        <div class="section-label">忌口（不加）</div>
        <div class="chips" id="chips-avoid"></div>
      </div>
      <div class="section" id="sec-temp" style="display:none">
        <div class="section-label">冷热</div>
        <div class="chips" id="chips-temp"></div>
      </div>
      <div class="qty-row">
        <div class="lab">份数</div>
        <div class="stepper">
          <button id="minus" onclick="changeQty(-1)">−</button>
          <div class="num" id="qty">1</div>
          <button id="plus" onclick="changeQty(1)">＋</button>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="total">
        <div class="t-label">小计</div>
        <div class="t-price" id="subtotal"></div>
      </div>
      <button class="btn" onclick="addToCart()">加</button>
    </div>
  </div>

  <div class="view" id="view-confirm">
    <div class="nav">
      <div class="back" onclick="go('home')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="title">确认订单</div>
      <div class="placeholder"></div>
    </div>
    <div class="view-scroll">
      <div class="cart-list" id="cart-list"></div>
      <div class="field">
        <div class="field-label">门牌号</div>
        <input id="order-room" autocomplete="off">
      </div>
      <div class="field">
        <div class="field-label">期望送达时间</div>
        <div class="chips" id="chips-delivery">
          <div class="chip on" data-d="尽快送达">尽快送达</div>
          <div class="chip" data-d="预定">预定（时间写在备注）</div>
        </div>
      </div>
      <div class="note">
        <textarea id="order-note" placeholder="备注"></textarea>
      </div>
    </div>
    <div class="footer">
      <div class="total">
        <div class="t-label">合计</div>
        <div class="t-price" id="grand-total"></div>
      </div>
      <button class="btn" id="submit-btn" onclick="generateReceipt()">生成订单小票</button>
    </div>
  </div>

  <div class="view" id="view-receipt">
    <div class="nav">
      <div class="back" onclick="go('confirm')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="title">订单小票</div>
      <div class="placeholder"></div>
    </div>
    <div class="view-scroll">
      <div class="receipt-wrap">
        <div class="receipt-tip">订单已生成，<b>长按图片保存</b>，再发送给店主；也可点下方按钮复制文字。</div>
        <img class="receipt-img" id="receipt-img" alt="订单小票" style="display:none">
        <div class="receipt-panel" id="receipt-panel"></div>
        <div class="receipt-actions">
          <button class="btn" onclick="copyOrderText()">复制订单文字</button>
          <button class="btn ghost" onclick="go('home')">返回菜单</button>
        </div>
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
  const MENU = [
    {
      group: "炒饭",
      items: [
        {
          id: 1, name: "牛肉末蛋炒饭", img: "friedrice01.webp",
          cny: 47, gbp: 5.5,
          desc: ["米饭、鸡蛋、牛肉末、洋葱、小葱、蒜酥等（默认微微辣）"],
          avoids: ["不加小葱", "不加洋葱", "不加蒜酥"],
          temps: []
        }
      ]
    },
    {
      group: "饮品",
      items: [
        {
          id: 2, name: "抹茶拿铁", img: "motcha01.webp",
          cny: 17, gbp: 2,
          desc: ["不含咖啡！不含咖啡！", "牛奶、抹茶粉等"],
          avoids: [], temps: ["热", "冰"]
        },
        {
          id: 3, name: "红枣牛奶", img: "datemilk01.webp",
          cny: 12, gbp: 1.5,
          desc: ["默认温热", "牛奶、红枣、红糖等"],
          avoids: [], temps: []
        }
      ]
    }
  ];

  let cart = [];
  let dish = null;
  let cur = { avoids: new Set(), temp: null, qty: 1 };
  let deliveryType = "尽快送达";
  let currentOrder = null;

  function fmtPrice(cny, gbp) {
    const g = Math.round(gbp * 10) / 10;
    return `${cny}￥ / ${Number.isInteger(g) ? g : g.toFixed(1)}￡`;
  }

  function go(view) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + view).classList.add("active");
    if (view === "home") renderMenu();
    if (view === "confirm") renderCart();
  }

  function renderMenu() {
    const scroll = document.getElementById("menu-scroll");
    scroll.innerHTML = MENU.map(section => `
      <div class="group-label">${section.group}</div>
      <div class="menu-list">
        ${section.items.map(it => `
          <div class="menu-card" onclick="openDetail(${it.id})">
            <div class="menu-thumb"><img src="${it.img}" alt="${it.name}" onerror="this.style.display='none'"></div>
            <div class="menu-info">
              <div class="n">${it.name}</div>
              <div class="d">${it.desc.join("；")}</div>
              <div class="p">${fmtPrice(it.cny, it.gbp)}</div>
            </div>
          </div>`).join("")}
      </div>`).join("");
    const count = cart.reduce((s, i) => s + i.qty, 0);
    const badge = document.getElementById("cart-badge");
    badge.style.display = count > 0 ? "flex" : "none";
    badge.textContent = count;
  }

  function findDish(id) {
    for (const s of MENU) {
      const hit = s.items.find(i => i.id === id);
      if (hit) return hit;
    }
    return null;
  }

  function openDetail(id) {
    dish = findDish(id);
    cur = { avoids: new Set(), temp: dish.temps[0] || null, qty: 1 };

    document.getElementById("d-img").src = dish.img;
    document.getElementById("d-img").alt = dish.name;
    document.getElementById("d-img").style.display = "";
    document.getElementById("d-name").textContent = dish.name;
    document.getElementById("d-desc").innerHTML = dish.desc.map(d => `<div>${d}</div>`).join("");
    document.getElementById("d-price").textContent = fmtPrice(dish.cny, dish.gbp);

    const avoidBox = document.getElementById("chips-avoid");
    avoidBox.innerHTML = "";
    document.getElementById("sec-avoid").style.display = dish.avoids.length ? "" : "none";
    dish.avoids.forEach(a => {
      const el = document.createElement("div");
      el.className = "chip"; el.textContent = a;
      el.onclick = () => toggleAvoid(a, el);
      avoidBox.appendChild(el);
    });

    const tempBox = document.getElementById("chips-temp");
    tempBox.innerHTML = "";
    document.getElementById("sec-temp").style.display = dish.temps.length ? "" : "none";
    dish.temps.forEach(t => {
      const el = document.createElement("div");
      el.className = "chip" + (cur.temp === t ? " on" : "");
      el.textContent = t;
      el.onclick = () => { cur.temp = t; document.querySelectorAll("#chips-temp .chip").forEach(c => c.classList.remove("on")); el.classList.add("on"); };
      tempBox.appendChild(el);
    });

    syncQty();
    go("detail");
  }

  function toggleAvoid(a, el) {
    if (cur.avoids.has(a)) { cur.avoids.delete(a); el.classList.remove("on"); }
    else { cur.avoids.add(a); el.classList.add("on"); }
  }
  function changeQty(d) {
    cur.qty = Math.max(1, Math.min(9, cur.qty + d));
    syncQty();
  }
  function syncQty() {
    document.getElementById("qty").textContent = cur.qty;
    document.getElementById("minus").disabled = cur.qty <= 1;
    updateSubtotal();
  }
  function linePrice() {
    return {
      cny: dish.cny * cur.qty,
      gbp: Math.round(dish.gbp * cur.qty * 10) / 10
    };
  }
  function updateSubtotal() {
    const p = linePrice();
    document.getElementById("subtotal").textContent = fmtPrice(p.cny, p.gbp);
  }

  function addToCart() {
    const p = linePrice();
    cart.push({
      id: dish.id, name: dish.name,
      avoids: [...cur.avoids], temp: cur.temp,
      qty: cur.qty, lineCny: p.cny, lineGbp: p.gbp
    });
    toast("已加入");
    go("home");
  }

  function renderCart() {
    const box = document.getElementById("cart-list");
    if (cart.length === 0) {
      box.innerHTML = '<div class="empty">还没有点菜</div>';
      document.getElementById("grand-total").textContent = "0";
      return;
    }
    box.innerHTML = cart.map(it => {
      const opts = [
        ...it.avoids.map(a => `<span class="tag">${a}</span>`),
        ...(it.temp ? [`<span class="tag">${it.temp}</span>`] : [])
      ].join("");
      return `
        <div class="cart-item">
          <div class="ci-top">
            <div class="ci-name">${it.name}</div>
            <div class="ci-price">${fmtPrice(it.lineCny, it.lineGbp)}</div>
          </div>
          ${opts ? `<div class="ci-opts">${opts}</div>` : ""}
          <div class="ci-qty">× ${it.qty}</div>
        </div>`;
    }).join("");
    const totalCny = cart.reduce((s, i) => s + i.lineCny, 0);
    const totalGbp = Math.round(cart.reduce((s, i) => s + i.lineGbp, 0) * 10) / 10;
    document.getElementById("grand-total").textContent = fmtPrice(totalCny, totalGbp);
  }

  function initDelivery() {
    document.querySelectorAll("#chips-delivery .chip").forEach(el => {
      el.onclick = () => {
        document.querySelectorAll("#chips-delivery .chip").forEach(c => c.classList.remove("on"));
        el.classList.add("on");
        deliveryType = el.dataset.d;
        document.getElementById("order-note").placeholder = deliveryType === "预定" ? "填写期望送达时间，例如 18:30" : "备注";
      };
    });
  }

  function buildOrder() {
    const room = document.getElementById("order-room").value.trim();
    const note = document.getElementById("order-note").value.trim();
    const totalCny = cart.reduce((s, i) => s + i.lineCny, 0);
    const totalGbp = Math.round(cart.reduce((s, i) => s + i.lineGbp, 0) * 10) / 10;
    return {
      id: "LZ-" + Date.now().toString().slice(-6),
      time: new Date().toLocaleString("zh-CN", { hour12: false }),
      room, note, delivery: deliveryType,
      items: cart.map(it => ({ ...it })),
      totalCny, totalGbp
    };
  }

  function buildOrderText(o) {
    const lines = o.items.map((it, i) => {
      const opts = [...it.avoids, ...(it.temp ? [it.temp] : [])];
      const optStr = opts.length ? `（${opts.join("，")}）` : "";
      return `${i + 1}. ${it.name} ×${it.qty}${optStr}　${fmtPrice(it.lineCny, it.lineGbp)}`;
    });
    return [
      `【留子厨房 LZ Kitchen】新订单 ${o.id}`,
      `下单时间：${o.time}`,
      `门牌号：${o.room || "未填写"}`,
      `送达方式：${o.delivery}`,
      ``,
      `菜品明细：`,
      ...lines,
      ``,
      `备注：${o.note || "无"}`,
      `合计：${fmtPrice(o.totalCny, o.totalGbp)}`
    ].join("\n");
  }

  function renderReceiptPanel(o) {
    const items = o.items.map((it, i) => {
      const opts = [...it.avoids, ...(it.temp ? [it.temp] : [])];
      return `
        <div class="rp-item">
          <div class="ri-top"><span>${i + 1}. ${it.name} ×${it.qty}</span><span>${fmtPrice(it.lineCny, it.lineGbp)}</span></div>
          ${opts.length ? `<div class="ri-opts">${opts.join("，")}</div>` : ""}
        </div>`;
    }).join("");
    document.getElementById("receipt-panel").innerHTML = `
      <div class="rp-head">
        <div class="rp-title">留子厨房 LZ Kitchen</div>
        <div class="rp-sub">新订单 ${o.id}</div>
      </div>
      <div class="rp-meta">
        <div>下单时间：${o.time}</div>
        <div>门牌号：${o.room || "未填写"}</div>
        <div>送达方式：${o.delivery}</div>
      </div>
      <div class="rp-items">${items}</div>
      <div class="rp-note">备注：${o.note || "无"}</div>
      <div class="rp-total"><span>合计</span><span>${fmtPrice(o.totalCny, o.totalGbp)}</span></div>`;
  }

  async function generateReceipt() {
    if (cart.length === 0) { toast("还没有点菜"); return; }
    currentOrder = buildOrder();
    renderReceiptPanel(currentOrder);
    go("receipt");
    copyOrderText();

    const panel = document.getElementById("receipt-panel");
    const img = document.getElementById("receipt-img");
    try {
      if (typeof html2canvas === "undefined") throw new Error("lib missing");
      const canvas = await html2canvas(panel, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
      img.src = canvas.toDataURL("image/png");
      img.style.display = "block";
      panel.style.display = "none";
    } catch (e) {
      img.style.display = "none";
      panel.style.display = "";
      toast("图片生成失败，可直接复制文字发送");
    }
  }

  async function copyOrderText() {
    if (!currentOrder) return;
    const text = buildOrderText(currentOrder);
    try {
      await navigator.clipboard.writeText(text);
      toast("订单文字已复制");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      toast("订单文字已复制");
    }
  }

  let timer;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(timer);
    timer = setTimeout(() => el.classList.remove("show"), 2600);
  }

  initDelivery();
  renderMenu();
</script>
</body>
</html>
